<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eee8"/>
      <stop offset="100%" stop-color="#faf9f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg3)" rx="8"/>
  <!-- Timeline -->
  <line x1="100" y1="120" x2="700" y2="120" stroke="#e2dfd6" stroke-width="2"/>
  <!-- Step 1 -->
  <circle cx="150" cy="120" r="16" fill="#0ea567"/>
  <text x="150" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="150" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1814" text-anchor="middle">DNS Query</text>
  <text x="150" y="185" font-family="Inter, sans-serif" font-size="11" fill="#8a8578" text-anchor="middle">~5-20ms</text>
  <!-- Step 2 -->
  <circle cx="300" cy="120" r="16" fill="#0e7f8d"/>
  <text x="300" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="300" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1814" text-anchor="middle">TCP Handshake</text>
  <text x="300" y="185" font-family="Inter, sans-serif" font-size="11" fill="#8a8578" text-anchor="middle">SYN → SYN-ACK → ACK</text>
  <!-- Step 3 -->
  <circle cx="450" cy="120" r="16" fill="#7c62c0"/>
  <text x="450" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="450" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1814" text-anchor="middle">TLS Handshake</text>
  <text x="450" y="185" font-family="Inter, sans-serif" font-size="11" fill="#8a8578" text-anchor="middle">Certificate check</text>
  <!-- Step 4 -->
  <circle cx="600" cy="120" r="16" fill="#dd6a1c"/>
  <text x="600" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="600" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1814" text-anchor="middle">HTTP Request</text>
  <text x="600" y="185" font-family="Inter, sans-serif" font-size="11" fill="#8a8578" text-anchor="middle">GET / HTTP/1.1</text>
  <!-- Summary box -->
  <rect x="100" y="240" width="600" height="110" rx="12" fill="#fff" stroke="#e2dfd6" stroke-width="1.5"/>
  <text x="130" y="275" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1a1814">Total latency breakdown</text>
  <text x="130" y="300" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c574d">DNS: 12ms + TCP: 28ms + TLS: 45ms + Server: 120ms = ~205ms</text>
  <text x="130" y="325" font-family="Inter, sans-serif" font-size="12" fill="#8a8578">Setiap step punya bottleneck sendiri. TLS handshake sering jadi yang paling lambat.</text>
</svg>
