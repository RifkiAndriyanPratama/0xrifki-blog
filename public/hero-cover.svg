<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101823"/>
      <stop offset="1" stop-color="#14222e"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fedac"/>
      <stop offset="1" stop-color="#49b3bc"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1b2733" opacity="0.9"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#heroBg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>

  <!-- Glows -->
  <circle cx="200" cy="180" r="260" fill="#5fedac" opacity="0.14" filter="url(#blur)"/>
  <circle cx="640" cy="860" r="300" fill="#49b3bc" opacity="0.16" filter="url(#blur)"/>

  <!-- Circuit traces -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 120 H 150 V 330 H 300" stroke="#49b3bc" stroke-width="2" opacity="0.45"/>
    <path d="M0 120 H 150 V 330 H 300" stroke="#49b3bc" stroke-width="6" opacity="0.10"/>
    <path d="M800 210 H 660 V 380" stroke="#5fedac" stroke-width="2" opacity="0.45"/>
    <path d="M800 210 H 660 V 380" stroke="#5fedac" stroke-width="6" opacity="0.10"/>
    <path d="M60 1000 V 760 L 260 760 V 610" stroke="#49b3bc" stroke-width="2" opacity="0.5"/>
    <path d="M300 1000 V 830 H 520 V 760" stroke="#5fedac" stroke-width="2" opacity="0.5"/>
  </g>
  <g fill="#5fedac">
    <circle cx="300" cy="330" r="7"/>
    <circle cx="260" cy="760" r="7" fill="#49b3bc"/>
    <circle cx="300" cy="830" r="5" fill="#49b3bc"/>
  </g>

  <!-- Title -->
  <text x="80" y="96" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#ffffff" opacity="0.95" letter-spacing="1">$ low-level notes</text>
  <text x="80" y="128" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5fedac" letter-spacing="2">0x0 / memory / registers / syscalls</text>

  <!-- CPU chip -->
  <g>
    <!-- pins -->
    <g fill="#2b3a4a">
      <g>
        <rect x="292" y="236" width="14" height="16"/><rect x="326" y="236" width="14" height="16"/>
        <rect x="360" y="236" width="14" height="16"/><rect x="394" y="236" width="14" height="16"/>
        <rect x="428" y="236" width="14" height="16"/><rect x="462" y="236" width="14" height="16"/>
        <rect x="496" y="236" width="14" height="16"/>
      </g>
      <g>
        <rect x="292" y="596" width="14" height="16"/><rect x="326" y="596" width="14" height="16"/>
        <rect x="360" y="596" width="14" height="16"/><rect x="394" y="596" width="14" height="16"/>
        <rect x="428" y="596" width="14" height="16"/><rect x="462" y="596" width="14" height="16"/>
        <rect x="496" y="596" width="14" height="16"/>
      </g>
      <g>
        <rect x="224" y="298" width="16" height="14"/><rect x="224" y="332" width="16" height="14"/>
        <rect x="224" y="366" width="16" height="14"/><rect x="224" y="400" width="16" height="14"/>
        <rect x="224" y="434" width="16" height="14"/><rect x="224" y="468" width="16" height="14"/>
        <rect x="224" y="502" width="16" height="14"/>
      </g>
      <g>
        <rect x="560" y="298" width="16" height="14"/><rect x="560" y="332" width="16" height="14"/>
        <rect x="560" y="366" width="16" height="14"/><rect x="560" y="400" width="16" height="14"/>
        <rect x="560" y="434" width="16" height="14"/><rect x="560" y="468" width="16" height="14"/>
        <rect x="560" y="502" width="16" height="14"/>
      </g>
    </g>
    <!-- body -->
    <rect x="248" y="252" width="304" height="344" rx="26" fill="#121a24" stroke="url(#mint)" stroke-width="2.5"/>
    <!-- die -->
    <rect x="298" y="308" width="204" height="176" rx="12" fill="#0b1016" stroke="#2b3a4a" stroke-width="2"/>
    <g fill="none" stroke-linecap="round">
      <path d="M320 340 H 470 V 400" stroke="#5fedac" stroke-width="2" opacity="0.8"/>
      <path d="M470 380 H 350 V 450" stroke="#49b3bc" stroke-width="2" opacity="0.8"/>
      <path d="M340 460 H 480" stroke="#ef7a2b" stroke-width="2" opacity="0.7"/>
    </g>
    <circle cx="470" cy="400" r="6" fill="#5fedac"/>
    <circle cx="350" cy="450" r="6" fill="#49b3bc"/>
    <text x="400" y="528" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="url(#mint)">0xRIFKI</text>
    <text x="400" y="556" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#8aa0b8" letter-spacing="1">64-BIT · 4 CORES · x86-64</text>
  </g>

  <!-- Register pills -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">
    <g>
      <rect x="130" y="180" width="92" height="30" rx="15" fill="#5fedac" opacity="0.15"/>
      <text x="176" y="200" text-anchor="middle" fill="#5fedac">RAX</text>
    </g>
    <g>
      <rect x="578" y="180" width="92" height="30" rx="15" fill="#49b3bc" opacity="0.15"/>
      <text x="624" y="200" text-anchor="middle" fill="#49b3bc">RBX</text>
    </g>
    <g>
      <rect x="130" y="640" width="92" height="30" rx="15" fill="#b79df0" opacity="0.15"/>
      <text x="176" y="660" text-anchor="middle" fill="#b79df0">RSP</text>
    </g>
    <g>
      <rect x="578" y="640" width="92" height="30" rx="15" fill="#e8c766" opacity="0.15"/>
      <text x="624" y="660" text-anchor="middle" fill="#e8c766">RIP</text>
    </g>
  </g>

  <!-- Assembly lines -->
  <g font-family="ui-monospace, Menlo, monospace">
    <text x="120" y="760" font-size="15" fill="#5fedac" font-weight="700">&gt; _start:</text>
    <text x="148" y="792" font-size="15" fill="#9fb4c9"><tspan fill="#5fedac">mov</tspan> rax, <tspan fill="#e8c766">0x3c</tspan></text>
    <text x="148" y="824" font-size="15" fill="#9fb4c9"><tspan fill="#5fedac">xor</tspan> rdi, rdi</text>
    <text x="148" y="856" font-size="15" fill="#9fb4c9"><tspan fill="#5fedac">syscall</tspan>          <tspan fill="#3f4f5f">; exit(0)</tspan></text>
    <text x="120" y="896" font-size="13" fill="#49b3bc">$ nm ./binary | grep ' T '</text>
    <text x="120" y="918" font-size="13" fill="#7d94a8">0x00401000 T _start</text>
  </g>

  <!-- Hexdump panel -->
  <g>
    <rect x="470" y="752" width="250" height="176" rx="16" fill="rgba(255,255,255,0.045)" stroke="#2b3a4a"/>
    <g font-family="ui-monospace, Menlo, monospace">
      <circle cx="490" cy="776" r="5" fill="#f06a6a"/>
      <circle cx="508" cy="776" r="5" fill="#e8c766"/>
      <circle cx="526" cy="776" r="5" fill="#6ccb8c"/>
      <text x="548" y="781" font-size="12" fill="#8aa0b8">objdump -d</text>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11">
      <text x="490" y="806" fill="#8aa0b8">0x0000  <tspan fill="#5fedac">55</tspan> 48 89 <tspan fill="#49b3bc">e5</tspan> 48 83 <tspan fill="#5fedac">ec</tspan> 10 c7 45 fc 00 00 00 00</text>
      <text x="490" y="824" fill="#8aa0b8">0x0010  <tspan fill="#5fedac">8b</tspan> 45 fc <tspan fill="#49b3bc">f7</tspan> d8 89 <tspan fill="#5fedac">c0</tspan> c9 <tspan fill="#ef7a2b">c3</tspan> 0f 1f 44 00 00</text>
      <text x="490" y="842" fill="#8aa0b8">0x0020  00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00</text>
      <text x="490" y="860" fill="#8aa0b8">0x0030  <tspan fill="#ef7a2b">ff</tspan> ff <tspan fill="#5fedac">ff</tspan> ff 0f 1f 40 00 48 8d 3d 00 00 00 00</text>
    </g>
    <text x="490" y="898" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#49b3bc">↑ stack grows down ↓</text>
    <text x="490" y="916" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8aa0b8">RSP → 0x7fffffffe2c0</text>
  </g>
</svg>